[package]
name = "sous"
version = "0.1.1"
edition = "2024"

[dependencies]
axum = "0.8"
caseless = "0.2.2"
chrono = "0.4"
chrono-tz = "0.10"
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
futures-util = "0.3"
headless_chrome = "1.0.22"
rmcp = { version = "3.8", default-features = false, features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
jsonschema = { version = "0.60.2", default-features = false }

[build-dependencies]
oxc = { version = "0.156", features = ["full"] }
