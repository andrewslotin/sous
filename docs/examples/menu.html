function formatDateRange() {
  const start = new Date(PLAN_DATES[0] + "T00:00:00");
  const end = new Date(PLAN_DATES[PLAN_DATES.length - 1] + "T00:00:00");
  const fmt = (d) => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  return `${fmt(start)} – ${fmt(end)}`;
}

function DaySummary({ meals }) {
  const totals = meals.reduce(
    (acc, m) => ({ kcal: acc.kcal + m.kcal, protein: acc.protein + m.protein, fat: acc.fat + m.fat, carbs: acc.carbs + m.carbs, fiber: acc.fiber + m.fiber }),
    { kcal: 0, protein: 0, fat: 0, carbs: 0, fiber: 0 }
  );
  return (
    <div style={{ display: "flex", gap: "16px", flexWrap: "wrap", padding: "14px 18px", background: "linear-gradient(135deg, #1a1a2e, #16213e)", borderRadius: "10px", marginBottom: "16px" }}>
      {[
        { label: "Calories", value: totals.kcal, unit: "kcal", color: "#f8fafc" },
        { label: "Protein", value: totals.protein, unit: "g", color: "#fb923c" },
        { label: "Fat", value: totals.fat, unit: "g", color: "#60a5fa" },
        { label: "Carbs", value: totals.carbs, unit: "g", color: "#4ade80" },
        { label: "Fiber", value: totals.fiber, unit: "g", color: "#c084fc" },
      ].map((item) => (
        <div key={item.label} style={{ textAlign: "center", minWidth: "56px", flex: 1 }}>
          <div style={{ fontSize: "20px", fontWeight: 700, color: item.color, fontFamily: "'JetBrains Mono', monospace" }}>
            {item.value}<span style={{ fontSize: "11px", fontWeight: 400, opacity: 0.7 }}>{item.unit}</span>
          </div>
          <div style={{ fontSize: "10px", color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.5px", marginTop: "2px" }}>{item.label}</div>
        </div>
      ))}
    </div>
  );
}

function MealCard({ meal }) {
  const [expanded, setExpanded] = useState(false);
  const colors = mealTypeColors[meal.type] || mealTypeColors.Snack;
  return (
    <div onClick={() => setExpanded(!expanded)} style={{
      background: "#fff", borderRadius: "10px", border: "1px solid #e2e8f0", borderLeft: `4px solid ${colors.border}`,
      padding: "14px 16px", marginBottom: "10px", cursor: "pointer", transition: "all 0.2s ease",
      boxShadow: expanded ? "0 4px 12px rgba(0,0,0,0.08)" : "0 1px 3px rgba(0,0,0,0.04)",
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div style={{ flex: 1 }}>
          <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "4px", flexWrap: "wrap" }}>
            <span style={{ fontSize: "14px" }}>{colors.icon}</span>
            <span style={{ fontSize: "10px", fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.8px", color: colors.border, fontFamily: "'JetBrains Mono', monospace" }}>{meal.type}</span>
            {meal.forTwo && <span style={{ fontSize: "9px", fontWeight: 600, background: "#dbeafe", color: "#1d4ed8", padding: "2px 6px", borderRadius: "4px" }}>FOR TWO</span>}
            {meal.assemblyTime && <span style={{ fontSize: "9px", fontWeight: 600, background: "#dcfce7", color: "#166534", padding: "2px 6px", borderRadius: "4px" }}>⚡ {meal.assemblyTime}</span>}
            {meal.cookTime && <span style={{ fontSize: "9px", fontWeight: 600, background: "#fef3c7", color: "#92400e", padding: "2px 6px", borderRadius: "4px" }}>🍳 {meal.cookTime}</span>}
          </div>
          <div style={{ fontSize: "15px", fontWeight: 600, color: "#1e293b", lineHeight: 1.3, fontFamily: "'Source Serif 4', Georgia, serif" }}>{meal.name}</div>
        </div>
        {meal.kcal > 0 && <div style={{ fontSize: "14px", fontWeight: 700, color: "#64748b", fontFamily: "'JetBrains Mono', monospace", whiteSpace: "nowrap", marginLeft: "12px" }}>{meal.kcal}</div>}
      </div>
      {expanded && (
        <div style={{ marginTop: "12px", paddingTop: "12px", borderTop: "1px solid #f1f5f9" }}>
          <p style={{ fontSize: "13px", color: "#475569", lineHeight: 1.5, margin: "0 0 10px 0", fontStyle: "italic" }}>{meal.desc}</p>
          <div style={{ display: "flex", gap: "12px", flexWrap: "wrap", marginBottom: "10px" }}>
            {[
              { label: "P", value: meal.protein, color: "#fb923c" },
              { label: "F", value: meal.fat, color: "#60a5fa" },
              { label: "C", value: meal.carbs, color: "#4ade80" },
              { label: "Fib", value: meal.fiber, color: "#c084fc" },
            ].map((m) => (
              <span key={m.label} style={{ fontSize: "11px", fontFamily: "'JetBrains Mono', monospace", color: m.color, fontWeight: 600 }}>{m.label} {m.value}g</span>
            ))}
          </div>
          <div style={{ marginBottom: "10px" }}>
            <div style={{ fontSize: "11px", fontWeight: 700, color: "#334155", textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: "6px" }}>Instructions</div>
            <ol style={{ fontSize: "12.5px", color: "#334155", margin: 0, paddingLeft: "18px", lineHeight: 1.7 }}>
              {meal.steps.map((step, i) => <li key={i} style={{ marginBottom: "4px" }}>{step}</li>)}
            </ol>
          </div>
          {meal.tip && <div style={{ background: "#fefce8", border: "1px solid #fde68a", borderRadius: "6px", padding: "8px 10px", fontSize: "12px", color: "#92400e", lineHeight: 1.4 }}>💡 {meal.tip}</div>}
        </div>
      )}
    </div>
  );
}

function PrepCard({ session }) {
  const [expanded, setExpanded] = useState(false);
  return (
    <div onClick={() => setExpanded(!expanded)} style={{
      background: "#fffbeb", borderRadius: "10px", border: "1px solid #fde68a", padding: "16px", marginBottom: "12px", cursor: "pointer",
      boxShadow: expanded ? "0 4px 12px rgba(0,0,0,0.08)" : "0 1px 3px rgba(0,0,0,0.04)",
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>
          <div style={{ fontSize: "16px", fontWeight: 700, color: "#92400e", fontFamily: "'Source Serif 4', Georgia, serif" }}>🔪 {session.title}</div>
          <div style={{ fontSize: "12px", color: "#b45309", marginTop: "2px" }}>{session.covers}</div>
        </div>
        <span style={{ fontSize: "18px", color: "#92400e" }}>{expanded ? "−" : "+"}</span>
      </div>
      {expanded && (
        <div style={{ marginTop: "14px", paddingTop: "12px", borderTop: "1px solid #fde68a" }}>
          {session.tasks.map((task, i) => (
            <div key={i} style={{ marginBottom: "12px", padding: "10px 12px", background: "#fff", borderRadius: "8px", border: "1px solid #fef3c7" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "4px" }}>
                <span style={{ fontSize: "13px", fontWeight: 600, color: "#1e293b" }}>{task.name}</span>
                <span style={{ fontSize: "10px", fontWeight: 600, color: "#92400e", background: "#fef3c7", padding: "2px 6px", borderRadius: "4px", fontFamily: "'JetBrains Mono', monospace" }}>{task.time}</span>
              </div>
              <p style={{ fontSize: "12px", color: "#475569", lineHeight: 1.6, margin: 0 }}>{task.instructions}</p>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ShoppingListCard({ list }) {
  const [expanded, setExpanded] = useState(false);
  const [checked, setChecked] = useState({});
  const toggleItem = (catIdx, itemIdx, e) => { e.stopPropagation(); const key = `${catIdx}-${itemIdx}`; setChecked(prev => ({ ...prev, [key]: !prev[key] })); };
  const totalItems = list.categories.reduce((acc, c) => acc + c.items.length, 0);
  const checkedCount = Object.values(checked).filter(Boolean).length;
  return (
    <div style={{ background: "#fff0f6", borderRadius: "10px", border: "1px solid #fbb6ce", padding: "16px", marginBottom: "12px", boxShadow: expanded ? "0 4px 12px rgba(0,0,0,0.08)" : "0 1px 3px rgba(0,0,0,0.04)" }}>
      <div onClick={() => setExpanded(!expanded)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }}>
        <div>
          <div style={{ fontSize: "15px", fontWeight: 700, color: "#9d174d", fontFamily: "'Source Serif 4', Georgia, serif" }}>{list.label}</div>
          <div style={{ fontSize: "11px", color: "#be185d", marginTop: "2px" }}>{checkedCount}/{totalItems} items · {list.note}</div>
        </div>
        <span style={{ fontSize: "18px", color: "#9d174d" }}>{expanded ? "−" : "+"}</span>
      </div>
      {expanded && (
        <div style={{ marginTop: "14px", paddingTop: "12px", borderTop: "1px solid #fbb6ce" }}>
          {list.categories.map((cat, catIdx) => (
            <div key={catIdx} style={{ marginBottom: "12px" }}>
              <div style={{ fontSize: "12px", fontWeight: 700, color: "#9d174d", marginBottom: "4px" }}>{cat.name}</div>
              {cat.items.map((item, itemIdx) => {
                const key = `${catIdx}-${itemIdx}`; const isChecked = checked[key];
                return (
                  <div key={itemIdx} onClick={(e) => toggleItem(catIdx, itemIdx, e)} style={{ display: "flex", alignItems: "center", gap: "8px", padding: "5px 8px", borderRadius: "6px", background: isChecked ? "#f0fdf4" : "transparent", cursor: "pointer", transition: "background 0.15s ease" }}>
                    <div style={{ width: "18px", height: "18px", borderRadius: "4px", border: isChecked ? "2px solid #16a34a" : "2px solid #d4d4d8", background: isChecked ? "#16a34a" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, transition: "all 0.15s ease" }}>
                      {isChecked && <span style={{ color: "#fff", fontSize: "11px", fontWeight: 700 }}>✓</span>}
                    </div>
                    <span style={{ fontSize: "12px", color: isChecked ? "#6b7280" : "#334155", textDecoration: isChecked ? "line-through" : "none", lineHeight: 1.5 }}>{item}</span>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function MealPlan() {
  const [activeTab, setActiveTab] = useState("plan");
  const [selectedDay, setSelectedDay] = useState(() => {
    const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const todayName = dayNames[new Date().getDay()];
    const idx = DAYS.findIndex(d => d.day === todayName);
    return idx >= 0 ? idx : 0;
  });
  return (
    <div style={{ fontFamily: "'Inter', -apple-system, sans-serif", maxWidth: "540px", margin: "0 auto", padding: "20px 16px", background: "#f8fafc", minHeight: "100vh" }}>
      <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
      <div style={{ marginBottom: "16px" }}>
        <h1 style={{ fontSize: "22px", fontWeight: 700, color: "#0f172a", margin: "0 0 4px 0", fontFamily: "'Source Serif 4', Georgia, serif" }}>Meal Plan: {formatDateRange()}</h1>
        <p style={{ fontSize: "12px", color: "#64748b", margin: 0 }}>Salmon week · Homemade gravlax · Air fryer · Seasonal variety · Sun + Wed shop</p>
      </div>
      <div style={{ display: "flex", gap: "8px", marginBottom: "16px" }}>
        {[{ id: "plan", label: "Daily Plan" }, { id: "prep", label: "Prep Sessions" }, { id: "strategy", label: "Strategy" }].map((tab) => (
          <button key={tab.id} onClick={() => setActiveTab(tab.id)} style={{
            padding: "8px 16px", borderRadius: "8px", border: "none",
            background: activeTab === tab.id ? "linear-gradient(135deg, #1a1a2e, #16213e)" : "#fff",
            color: activeTab === tab.id ? "#f8fafc" : "#64748b", fontSize: "12px", fontWeight: 600, cursor: "pointer",
            boxShadow: activeTab === tab.id ? "0 2px 8px rgba(26,26,46,0.3)" : "0 1px 2px rgba(0,0,0,0.06)",
          }}>{tab.label}</button>
        ))}
      </div>
      {activeTab === "plan" && (
        <>
          <div style={{ display: "flex", gap: "6px", marginBottom: "16px", overflowX: "auto", paddingBottom: "4px" }}>
            {DAYS.map((d, i) => (
              <button key={d.day} onClick={() => setSelectedDay(i)} style={{
                padding: "8px 14px", borderRadius: "8px", border: "none",
                background: selectedDay === i ? "linear-gradient(135deg, #1a1a2e, #16213e)" : "#fff",
                color: selectedDay === i ? "#f8fafc" : "#64748b", fontSize: "12px", fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap",
                boxShadow: selectedDay === i ? "0 2px 8px rgba(26,26,46,0.3)" : "0 1px 2px rgba(0,0,0,0.06)",
              }}>{d.day.slice(0, 3)}</button>
            ))}
          </div>
          {DAYS[selectedDay].shoppingList && <ShoppingListCard list={SHOPPING_LISTS[DAYS[selectedDay].shoppingList]} />}
          <DaySummary meals={DAYS[selectedDay].meals} />
          {DAYS[selectedDay].meals.map((meal, i) => <MealCard key={`${selectedDay}-${i}`} meal={meal} />)}
          {DAYS[selectedDay].day === "Saturday" && (
            <div style={{
              marginTop: "8px", padding: "14px 16px",
              background: "linear-gradient(135deg, #eff6ff, #dbeafe)",
              borderRadius: "10px", border: "1px solid #93c5fd",
              display: "flex", alignItems: "center", gap: "10px",
            }}>
              <span style={{ fontSize: "20px" }}>📋</span>
              <div>
                <div style={{ fontSize: "13px", fontWeight: 600, color: "#1e40af" }}>Time for next week's plan!</div>
                <div style={{ fontSize: "12px", color: "#3b82f6", marginTop: "2px" }}>Ask Claude to generate your meal plan for next week.</div>
              </div>
            </div>
          )}
        </>
      )}
      {activeTab === "prep" && (
        <>
          <p style={{ fontSize: "13px", color: "#475569", marginTop: 0, marginBottom: "16px", lineHeight: 1.5 }}>
            Sunday covers Sun dinner–Wed (and starts the gravlax). Wednesday is a smaller session for Thu–Sat.
          </p>
          {PREP_SESSIONS.map((s) => <PrepCard key={s.id} session={s} />)}
        </>
      )}
      {activeTab === "strategy" && (
        <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
          <div style={{ padding: "14px 16px", background: "linear-gradient(135deg, #ecfdf5, #f0fdf4)", borderRadius: "10px", border: "1px solid #bbf7d0" }}>
            <div style={{ fontSize: "13px", fontWeight: 600, color: "#166534", marginBottom: "6px" }}>🐟 Weekly Variety</div>
            <ul style={{ fontSize: "12px", color: "#15803d", margin: 0, paddingLeft: "16px", lineHeight: 1.7 }}>
              <li>Oily fish 5× (fresh salmon ×3 + gravlax across several meals)</li>
              <li>Legumes daily (chickpeas, lentils, edamame)</li>
              <li>Oats and cocoa breakfasts for variety</li>
              <li>Nuts daily — walnuts & almonds</li>
              <li>Hard cheese as a garnish (~25-30g)</li>
              <li>Mix fresh and cooked vegetables throughout the week</li>
            </ul>
          </div>
          <div style={{ padding: "14px 16px", background: "#eff6ff", borderRadius: "10px", border: "1px solid #bfdbfe" }}>
            <div style={{ fontSize: "13px", fontWeight: 600, color: "#1e40af", marginBottom: "6px" }}>🍳 Air Fryer Features</div>
            <ul style={{ fontSize: "12px", color: "#1e40af", margin: 0, paddingLeft: "16px", lineHeight: 1.7 }}>
              <li>Sun: crispy salmon + roasted veg</li>
              <li>Sun prep: roasted chickpeas (salad topper)</li>
              <li>Wed: tofu katsu (crispy, barely any oil)</li>
              <li>Wed prep: roasted veg for lentil salad</li>
              <li>Fri: harissa chicken thighs</li>
            </ul>
          </div>
          <div style={{ padding: "14px 16px", background: "#fdf4ff", borderRadius: "10px", border: "1px solid #e9d5ff" }}>
            <div style={{ fontSize: "13px", fontWeight: 600, color: "#7e22ce", marginBottom: "6px" }}>🐟 The Salmon Plan (1.2 kg)</div>
            <ul style={{ fontSize: "12px", color: "#7e22ce", margin: 0, paddingLeft: "16px", lineHeight: 1.7 }}>
              <li>~300g → gravlax (cure Sun, ready Tue) → Wed/Thu/Sat meals</li>
              <li>~600g → 3 fresh dinners (air-fried Sun, miso Mon, en papillote Tue)</li>
              <li>~300g → frozen for a later week</li>
              <li>Each fresh prep is different to avoid salmon fatigue</li>
            </ul>
          </div>
          <div style={{ padding: "14px 16px", background: "#fefce8", borderRadius: "10px", border: "1px solid #fde68a" }}>
            <div style={{ fontSize: "13px", fontWeight: 600, color: "#92400e", marginBottom: "6px" }}>📝 This Week's Notes</div>
            <ul style={{ fontSize: "12px", color: "#92400e", margin: 0, paddingLeft: "16px", lineHeight: 1.7 }}>
              <li>Okroshka: soup or salad options for Mon + Tue</li>
              <li>Hard cheese: Manchego/Allgäuer as salad accents only</li>
              <li>Cuisines: Nordic (gravlax), Japanese (miso, katsu), French (papillote), N. African (harissa), Thai (curry)</li>
              <li>Sun + Wed shop split</li>
            </ul>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<MealPlan />);
</script>
</body>
</html>
